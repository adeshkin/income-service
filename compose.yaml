services:
  api:
    build: .
    ports: [ "8000:8000" ]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/income
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: income
    ports: [ "5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20

  locust:
    image: locustio/locust:2.46.6
    entrypoint: [ "locust" ]
    working_dir: /mnt/locust
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./:/results

volumes:
  pgdata:



