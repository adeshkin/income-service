# Prometheus Operator находит сервисы с меткой app: income и раз в 15 секунд забирает /metrics с порта http
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: income-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: income
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
